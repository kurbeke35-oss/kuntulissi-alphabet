<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuntulissi Talking Alphabet</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#241f1a;--mute:#6f665c;--acc:#b4531f;--acc2:#f3e2d3;--line:#e6ddd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171412;--card:#221e1b;--ink:#f2ebe3;--mute:#a69b8f;--acc:#f0925a;--acc2:#3a2a20;--line:#352f2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171412;--card:#221e1b;--ink:#f2ebe3;--mute:#a69b8f;--acc:#f0925a;--acc2:#3a2a20;--line:#352f2a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px;max-width:640px;margin-inline:auto}
h1{font-size:1.3rem;margin:4px 0 2px}
.sub{color:var(--mute);font-size:.9rem;margin:0 0 14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;text-align:center}
.big{font-size:3.6rem;font-weight:700;color:var(--acc);line-height:1}
.ipa{font-size:2rem;margin:6px 0;font-family:"Noto Sans","Segoe UI",serif}
.desc{color:var(--mute);margin:0 0 12px;min-height:2.6em}
button{font:inherit;cursor:pointer}
.play{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:10px 22px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;color:var(--ink)}
.tile.on{background:var(--acc2);border-color:var(--acc)}
.tile b{display:block;font-size:1.4rem}
.tile span{color:var(--mute);font-size:.95rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.bar button,.file{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem}
#status{color:var(--mute);font-size:.85rem;text-align:center;margin:0 0 12px}
</style>
</head>
<body>
